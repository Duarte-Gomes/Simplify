<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="profile-form">
    <ion-input
      label="Nome"
      labelPlacement="floating"
      fill="outline"
      formControlName="name"
      autocomplete="name"
      errorText="O nome é obrigatório."
    />

    <ion-input
      label="Morada"
      labelPlacement="floating"
      fill="outline"
      formControlName="address"
      autocomplete="street-address"
    />

    <div class="row postal">
      <ion-input
        label="Código postal"
        labelPlacement="floating"
        fill="outline"
        formControlName="postalCode"
        placeholder="0000-000"
        inputmode="numeric"
        autocomplete="postal-code"
        errorText="Formato: 0000-000."
      />
      <ion-input
        label="Localidade"
        labelPlacement="floating"
        fill="outline"
        formControlName="locality"
        autocomplete="address-level2"
      />
    </div>

    <div class="row phones">
      <ion-input
        label="Telefone de casa"
        labelPlacement="floating"
        fill="outline"
        type="tel"
        formControlName="homePhone"
        errorText="Número de telefone inválido."
      />
      <ion-input
        label="Telemóvel"
        labelPlacement="floating"
        fill="outline"
        type="tel"
        formControlName="mobilePhone"
        autocomplete="tel"
        errorText="Número de telemóvel inválido."
      />
    </div>

    <fieldset formArrayName="hobbies">
      <legend>Hobbies</legend>
      @for (hobby of hobbies.controls; track hobby; let i = $index) {
        <ion-input
          [label]="'Hobby ' + (i + 1)"
          labelPlacement="floating"
          fill="outline"
          [formControlName]="i"
          placeholder="Ex.: Leitura"
        >
          <ion-button
            slot="end"
            fill="clear"
            color="danger"
            aria-label="Remover hobby"
            (click)="removeHobby(i)"
            [disabled]="hobbies.length === 1"
          >
            <ion-icon slot="icon-only" name="trash-outline" aria-hidden="true" />
          </ion-button>
        </ion-input>
      }
      <ion-button fill="outline" size="small" (click)="addHobby()">
        <ion-icon slot="start" name="add-outline" aria-hidden="true" />
        Adicionar hobby
      </ion-button>
    </fieldset>

    <ion-button type="submit" expand="block">Guardar</ion-button>
  </form>
</ion-content>
